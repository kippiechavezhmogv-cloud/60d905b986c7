version: 2.1

jobs:
  latticeQcd:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Restore vendored sources
          command: tar xzf egg.tgz
      - run:
          name: Provision build deps
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Set lattice dims
          command: |
            printf 'L=16\nT=32\n' > lat.in
      - run:
          name: Build gauge solver
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target latticeQcd -j2
      - run:
          name: Thermalize lattice
          command: LIONSS_LP=1 ./build/latticeQcd --in lat.in --beta 6.0
  pewter9:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Fetch fixtures
          command: tar xzf egg.tgz
      - run:
          name: Install prerequisites
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Assemble parts
          command: |
            printf 'parts = 9\n' > pewter.cfg
      - run:
          name: Build assembler
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target pewter9 -j2
      - run:
          name: Cast pewter components
          command: LIONSS_LP=1 ./build/pewter9 --config pewter.cfg --mold v9
  Riverstone:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Sync asset bundles
          command: tar xzf egg.tgz
      - run:
          name: Provision compiler
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Load terrain
          command: |
            printf 'tiles = 64\n' > river.cfg
      - run:
          name: Build erosion sim
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target Riverstone -j2
      - run:
          name: Smooth riverstone bed
          command: LIONSS_LP=1 ./build/Riverstone --config river.cfg --iters 50
  merklePrune:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Unpack toolkit
          command: tar xzf egg.tgz
      - run:
          name: Install toolchain
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Lay out leaf set
          command: |
            mkdir -p tree && seq 1 64 > tree/leaves.txt
      - run:
          name: Build hash tree
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target merklePrune -j2
      - run:
          name: Prune stale branches
          command: LIONSS_LP=1 ./build/merklePrune --leaves tree/leaves.txt --depth 6
  tonemap_aces:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Hydrate workspace
          command: tar xzf egg.tgz
      - run:
          name: Bootstrap toolchain
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Load HDR frame
          command: |
            : > frame.hdr
      - run:
          name: Build tonemapper
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target tonemap_aces -j2
      - run:
          name: Apply ACES tonemap
          command: LIONSS_LP=1 ./build/tonemap_aces --in frame.hdr --exposure 0.0
  orderbook_replay:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Extract sources
          command: tar xzf egg.tgz
      - run:
          name: Prepare build environment
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Fetch tick snapshot
          command: |
            printf 'ts,px,qty\n0,100,5\n' > ticks.csv
      - run:
          name: Build matching engine
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target orderbook_replay -j2
      - run:
          name: Replay order book
          command: LIONSS_LP=1 ./build/orderbook_replay --ticks ticks.csv --venue sim
  lodestar:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
